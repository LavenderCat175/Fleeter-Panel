<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..800;1,400..800&display=swap" rel="stylesheet">
    <title>Fleeter Dashboard</title>
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            <i class="fas fa-chalkboard-user"></i>
            <span>Fleeter</span>
        </div>
        <div class="dashboard-title">
            <h1>Fleeter Admin Dashboard</h1>
        </div>
        <div class="navbar-actions">
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-user"></i>
                Logout
            </button>
            <button class="add-device-btn" id="addDeviceBtn">
                <i class="fas fa-plus"></i>
                Add Device
            </button>
        </div>
    </nav>
    <div class="dashboard-container">
        <div class="tile-container">
            <div class="tile-grid">
                <!-- Tiles generated by dashboard.py -->
            </div>
        </div>
    </div>
    <aside class="info-sidebar">
        <div class="sidebar-header">
            <div class="computer-badge">
                <i class="fas fa-computer"></i>
                <div>
                    <h3 id="sidebarComputerName">—</h3>
                    <span id="sidebarStatusBadge" style="font-size: 0.8rem; color:#6c757d;">—</span>
                </div>
            </div>
            <button class="close-sidebar" id="closeSidebar"><i class="fas fa-times"></i></button>
        </div>
        <div class="sidebar-content">
            <div class="info-group">
                <h4><i class="fas fa-info-circle"></i> Device Info</h4>
                <div class="detail-row">
                    <span class="detail-label">Device ID</span>
                    <span class="detail-value" id="sidebarDeviceId">—</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Status</span>
                    <span class="detail-value" id="sidebarStatus">—</span>
                </div>
            </div>
            <div class="info-group">
                <h4><i class="fas fa-gavel"></i> Admin Actions</h4>
                <div class="action-buttons">
                    <button class="action-btn block" id="blockButton">
                        <i class="fas fa-ban"></i> Block screen
                    </button>
                    <button class="action-btn remove" id="removeButton">
                        <i class="fas fa-trash"></i> Remove device
                    </button>
                </div>
            </div>
        </div>
    </aside>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fas fa-plus"></i> Add New Device</h3>
                <button class="close-modal" id="closeModal"><i class="fas fa-times"></i></button>
            </div>
            <div class="modal-body">
                <label for="deviceUUID">Device UUID</label>
                <input type="text" id="deviceUUID" placeholder="e.g., 123e4567-e89b-12d3-a456-426614174000">
                <button class="modal-submit-btn" id="modalSubmitBtn">
                    <i class="fas fa-download"></i> Generate & Download Token
                </button>
                <div class="modal-feedback" id="modalFeedback"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script type="module" src="https://pyscript.net/releases/2024.11.1/core.js"></script>
    <script type="py" src="dashboard.py"></script>
</body>
</html>
